# Training Configuration
# ======================
# Multi-stage training pipeline (Algorithm 6).
# Reference: manuscript Sections 3.5, 3.6; Algorithm 6.
#
# This configuration corresponds to the run reported in Tables 3, 4, 5 and 7
# (the "+ All + TEMPORAL" row). See docs/PAPER_FACTS.md for the canonical extract.

experiment:
  name: "financial_explainable_summarization"
  description: "Hybrid neural-symbolic model with FIBO integration (reported run)"
  reported_in: ["Table 3", "Table 4", "Table 5", "Table 7 (full system row)"]

# ---------------------------------------------------------------------------
# Data (Section 3.5)
# ---------------------------------------------------------------------------
data:
  # Corpus: 223,500 documents compiled, 215,500 retained after quality filtering.
  corpus_compiled: 223500
  corpus_after_filtering: 215500
  composition:
    sec_filings: 47000
    earnings_call_transcripts: 12000
    financial_news: 156000
    regulatory_documents: 8500

  # SINGLE TEMPORAL HOLDOUT — not k-fold, not a random split.
  # A random split would leak post-cutoff information and is NOT what was run.
  split:
    strategy: "temporal_holdout"
    train:      { start: "2015-01-01", end: "2022-12-31" }
    validation: { note: "tail of 2022, held out from the training range above" }
    test:       { start: "2023-01-01", end: "2024-12-31" }
    entity_disjointness_enforced: false   # issuers may recur across periods,
                                          # as they do in practice

  max_source_length: 1024
  max_target_length: 128

  # Knowledge graph is built ONLY from the training partition and then frozen.
  # Validation and test documents are linked against this frozen graph; no new
  # nodes or edges are added. This is the leakage-prevention protocol.
  knowledge_graph:
    built_from: "train_partition_only"
    frozen: true
    add_nodes_at_eval: false

  # Weakly-supervised training targets (Section 3.5).
  # These are distantly supervised: factual and scalable, but noisier and
  # stylistically less uniform than curated abstractive references.
  training_targets:
    financial_news: "article lead paragraph"
    sec_filings: "first five sentences of MD&A (Item 7)"
    earnings_calls: "closing management summary (final 2-3 paragraphs of prepared remarks)"

  # Evaluation gold standard (Section 3.5).
  evaluation_references:
    subset_size: 100
    drawn_from: "2023-2024 test period"
    stratified_by: "document type"
    curated_by: "3 CFA-certified analysts + 2 compliance officers"

# ---------------------------------------------------------------------------
# Multi-stage training (Algorithm 6)
# ---------------------------------------------------------------------------
training:
  multi_stage: true
  num_stages: 3
  total_epochs: 10        # 3 + 2 + 5

  stage1:
    name: "domain_pre_training"
    epochs: 3
    learning_rate: 1.0e-4
    batch_size: 16
    # Algorithm 6 line 4: standard cross-entropy fine-tuning of the backbone.
    objective: "cross_entropy"

  stage2:
    name: "knowledge_integration"
    epochs: 2
    learning_rate: 5.0e-5
    batch_size: 16
    # Algorithm 6 lines 8-9: adds KG encoding and cross-modal attention.
    objective: "cross_entropy_with_kg_attention"
    lambda_relation_weight: 0.5     # Equation 3

  stage3:
    name: "joint_optimization"
    epochs: 5
    learning_rate: 2.0e-5
    batch_size: 16
    # Algorithm 6 line 15: full composite loss (Equation 10).
    objective: "composite_loss"
    lr_decay_per_epoch: 0.9         # Stage 3 only (Section 3.6.2)

# ---------------------------------------------------------------------------
# Composite loss (Equation 10)
# ---------------------------------------------------------------------------
# L_total = alpha * L_sum + beta * L_kg + gamma * L_expl,  alpha+beta+gamma = 1.
# gamma is DERIVED as 1 - alpha - beta; the Bayesian search ranged over
# alpha and beta only (Section 3.6.1).
loss_weights:
  alpha: 0.72     # summarization
  beta:  0.18     # knowledge-graph alignment
  gamma: 0.10     # explanation  (== 1 - alpha - beta)

# ---------------------------------------------------------------------------
# Optimisation (Section 3.6.2)
# ---------------------------------------------------------------------------
optimization:
  optimizer: "AdamW"
  betas: [0.9, 0.999]
  weight_decay: 0.01
  scheduler:
    type: "linear_with_warmup"
    warmup_ratio: 0.1            # linear warm-up over the first 10% of steps
  max_grad_norm: 1.0

early_stopping:
  enabled: true
  patience: 2                    # epochs, on validation performance
  metric: "val_performance"

# ---------------------------------------------------------------------------
# Reproducibility (Section 3.6.3)
# ---------------------------------------------------------------------------
reproducibility:
  # FIVE independent runs. All reported mean +/- SD figures are across these seeds.
  seeds: [42, 123, 456, 789, 1011]
  deterministic: true
  cudnn_benchmark: false
  # Note: full bitwise determinism is not guaranteed across differing GPU models
  # or driver versions. See the Checkpoints section of README.md.

# ---------------------------------------------------------------------------
# Compute (Section 3.6.3)
# ---------------------------------------------------------------------------
compute:
  training:
    gpus: 4
    gpu_model: "NVIDIA A100 80GB"
    parallel: true
    wall_clock_hours: 27
    total_gpu_hours: 108
    estimated_cost_usd: 885       # AWS p4d.24xlarge @ $32.77/hour x 27 h
    stage_hours: { stage1: 4, stage2: 5, stage3: 18 }
    per_epoch_hours: { stage1: 1.3, stage2: 2.5, stage3: 3.6 }
  inference:
    gpus: 2
    gpu_model: "NVIDIA V100 32GB"
    seconds_per_document: 2.9
    peak_memory_gb: 9.8

# Values tagged [not in paper] below are implementation defaults, not reported
# settings.
distributed:
  enabled: true                   # 4 GPUs in parallel (Section 3.6.3)
  backend: "nccl"                 # [not in paper]
  world_size: 4

mixed_precision:                  # [not in paper]
  enabled: true
  precision: "fp16"

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
monitoring:
  mlflow:
    # MLflow 2.8.0 is listed in the software stack (Section 3.6.3); the paper
    # does not describe how it was configured. [experiment name not in paper]
    enabled: true
    experiment_name: "financial_summarization"
  tensorboard:                    # [not in paper]
    enabled: true
    log_dir: "runs/"

# ---------------------------------------------------------------------------
# Expected results
# ---------------------------------------------------------------------------
# Validation figures are what model selection was performed against
# (Section 3.6.2); test figures are what the paper reports (Table 3).
expected_results:
  validation:      # Section 3.6.2
    rouge_l: 0.487
    bertscore: 0.686
  test:            # Table 3, mean over the five seeds
    rouge_l:   { mean: 0.497, sd: 0.014 }
    rouge_1:   { mean: 0.452, sd: 0.016 }
    rouge_2:   { mean: 0.227, sd: 0.012 }
    bertscore: { mean: 0.673, sd: 0.018 }
    bleu_4:    { mean: 0.191, sd: 0.009 }
  explainability:  # Table 4
    ssi:         { mean: 0.74, sd: 0.06 }
    cps:         { mean: 0.51, sd: 0.07 }
    trust_calibration: { mean: 0.63, sd: 0.08 }
    explanation_consistency: { mean: 0.59, sd: 0.06 }
    tcc:         { mean: 0.54, sd: 0.07 }
  factual_consistency: 0.876   # Table 8, hybrid neural-symbolic row
